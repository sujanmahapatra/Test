# Render Blueprint: Render dashboard -> New -> Blueprint -> pick this
# repository. It asks for the values marked `sync: false`; secrets are never
# stored in this file.
services:
  - type: web
    name: automation-script-agent
    runtime: docker
    # Exploring and running tests opens Chromium. The free plan's 512 MB can
    # run out of memory on bigger apps; choose starter (2 GB) if it does.
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Everyone who opens the URL needs this to sign in (any user name).
      - key: APP_PASSWORD
        sync: false
      # Optional: lets Claude plan free-form steps. Without it, built-in rules plan them.
      - key: ANTHROPIC_API_KEY
        sync: false
